<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wasila{% endblock %} · Wasila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">و</span>
      <span class="brand-text">Wasila<small>One profile. Every Jamaat service.</small></span>
    </a>
    {% if user and user.role == 'user' %}
    <nav class="nav" aria-label="Main">
      <a href="{{ url_for('chat') }}" class="{{ 'active' if request.endpoint == 'chat' }}">Helpdesk</a>
      <a href="{{ url_for('documents') }}" class="{{ 'active' if request.endpoint == 'documents' }}">My Documents</a>
    </nav>
    {% endif %}
    {% if user %}
    <div class="account">
      <span class="account-name">{{ user.name }}</span>
      <span class="badge badge-{{ user.role }}">{{ 'Admin' if user.role == 'admin' else 'Member' }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="btn btn-ghost" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
